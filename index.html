<html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hot Beans</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      background:#0d0d0d; 
      color:white;
      min-height:100vh;
    }

    header{
      width:100%;
      padding:20px 5%;

      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      flex-wrap:wrap;

      border-bottom:1px solid rgba(255,255,255,0.2);
    }

    .logo-section{
      display:flex;
      align-items:center;
      gap:15px;
    }

    .logo{
      width:50px;
      height:50px;

      border:1px solid white;

      display:flex;
      justify-content:center;
      align-items:center;

      text-align:center;
      font-size:12px;
      line-height:1.2;
    }

    .title{
      color:#f4b36b;
      font-size:2rem;
      font-weight:500;
    }

    .search-btn{
      width:100%;
      max-width:180px;

      padding:12px 20px;

      background:transparent;
      border:2px solid white;
      border-radius:6px;

      color:white;
      font-size:1rem;

      cursor:pointer;
      transition:0.3s;
    }

    .search-btn:hover{
      background:white;
      color:black;
    }

    nav{
      width:100%;
      padding:15px 5%;

      border-bottom:1px solid rgba(255,255,255,0.2);
    }

    nav ul{
      display:flex;
      flex-wrap:wrap;
      gap:30px;

      list-style:none;
    }

    nav a{
      color:white;
      text-decoration:none;
      font-weight:bold;
      transition:0.3s;
    }

    nav a:hover{
      color:#f4b36b;
    }

    .main-container{
      width:100%;
      padding:40px 5%;

      display:flex;
      justify-content:center;
      align-items:center;
    }

    .job-section{
      width:100%;
      max-width:750px;

      min-height:500px;

      border:1px solid rgba(255,255,255,0.2);

      padding:25px;

      background:#111;

      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      gap:40px;
    }

    .editable-title{
      width:100%;

      background:transparent;
      border:none;
      outline:none;

      color:white;

      font-size:1.7rem;
      font-weight:bold;
    }

    .editable-title::placeholder{
      color:rgba(255,255,255,0.4);
    }

    .inner-box{
      width:100%;
      max-width:550px;

      min-height:250px;

      margin:0 auto;

      border:1px solid white;

      background:#0d0d0d;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:20px;
    }

    .editable-content{
      width:100%;
      min-height:180px;

      background:transparent;
      border:none;
      outline:none;
      resize:none;

      color:white;

      font-size:1rem;
      line-height:1.5;

      text-align:center;
    }

    .editable-content::placeholder{
      color:rgba(255,255,255,0.4);
    }

    @media (max-width:768px){

      header{
        flex-direction:column;
        align-items:flex-start;
      }

      .title{
        font-size:1.7rem;
      }

      nav ul{
        gap:20px;
      }

      .job-section{
        min-height:auto;
        padding:20px;
      }

      .editable-title{
        font-size:1.4rem;
      }

      .inner-box{
        min-height:220px;
      }

    }

    @media (max-width:600px){

      .search-btn{
        max-width:100%;
      }

    }

    @media (max-width:480px){

      .title{
        font-size:1.4rem;
      }

      nav ul{
        flex-direction:column;
        gap:15px;
      }

      .editable-title{
        font-size:1.2rem;
      }

      .inner-box{
        min-height:200px;
        padding:15px;
      }

      .editable-content{
        font-size:0.95rem;
      }

    }

  </style>

</head>

<body>

  <header>

    <div class="logo-section">

      <div class="logo">
        Blog<br>Logo
      </div>

      <h1 class="title">Hot Beans</h1>

    </div>

    <button class="search-btn">
      Search
    </button>

  </header>

  <nav>

    <ul>
      <li><a href="https://kristoffe99.github.io/home/">Home</a></li>
      <li><a href="https://kristoffe99.github.io/meet-the-team/">Meet the team</a></li>
      <li><a href="https://kristoffe99.github.io/profession/">Profession</a></li>
      <li><a href="https://kristoffe99.github.io/apply/">Apply</a></li>
      <li><a href="https://kristoffe99.github.io/courses/">Courses</a></li>
    </ul>

  </nav>

  <main class="main-container">

    <section class="job-section">

      <div class="inner-box">

        <textarea
          class="editable-content"
          placeholder="Enter job titles, qualifications, and descriptions here..."
        ></textarea>

      </div>
	  
	  <div class="submit-container">
  <button type="submit" class="submit-btn">
    Submit Application
  </button>
</div>

    </section>

  </main>

</body>
</html>
