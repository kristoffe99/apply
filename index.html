<html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hot Beans - Apply</title>
<style>
  *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: Arial, Helvetica, sans-serif;
  }

  body{
    background:#0b0b0b;
    color:white;
    min-height:100vh;
  }

  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    padding:15px 5%;
    border-bottom:1px solid rgba(255,255,255,0.2);
    gap:15px;
  }

  .logo{
    font-size:20px;
    font-weight:bold;
    color:#f4b36b;
  }

  nav ul{
    display:flex;
    list-style:none;
    gap:20px;
  }

  nav ul li a{
    text-decoration:none;
    color:white;
    font-weight:bold;
    transition:0.3s;
  }

  nav ul li a:hover{
    color:#f4b36b;
  }

  .search-bar{
    display:flex;
    gap:0;
  }

  .search-bar input{
    padding:8px 12px;
    border-radius:6px 0 0 6px;
    border:1px solid #333;
    background:#111;
    color:white;
    font-size:1rem;
    outline:none;
  }

  .search-bar button{
    padding:8px 16px;
    border:none;
    border-radius:0 6px 6px 0;
    background:#f4b36b;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
  }

  .search-bar button:hover{
    background:#ffa500;
  }

  .main-container{
    padding:40px 5%;
    display:flex;
    justify-content:center;
  }

  .apply-box{
    background:#111;
    border-radius:8px;
    padding:30px;
    max-width:600px;
    width:100%;
    border:2px solid #333;
  }

  .apply-box h2{
    text-align:center;
    margin-bottom:20px;
    color:#f4b36b;
  }

  form{
    display:flex;
    flex-direction:column;
    gap:20px;
  }

  label{
    font-weight:bold;
    margin-bottom:5px;
  }

  input{
    padding:10px;
    border-radius:6px;
    border:1px solid #333;
    background:#0b0b0b;
    color:white;
    font-size:1rem;
    width:100%;
  }

  .address-group{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }

  .address-group input{
    flex:1;
  }

  button.submit-btn{
    padding:12px;
    border:none;
    border-radius:6px;
    background:#f4b36b;
    color:#000;
    font-weight:bold;
    cursor:pointer;
    transition:0.3s;
  }

  button.submit-btn:hover{
    background:#ffa500;
  }

  @media(max-width:480px){
    .address-group{
      flex-direction:column;
    }
    nav ul{
      flex-direction:column;
      gap:10px;
      margin-top:10px;
    }
    .search-bar{
      width:100%;
      margin-top:10px;
    }
    .search-bar input{
      flex:1;
    }
  }

</style>
</head>
<body>

  <header>
    <div class="logo">Hot Beans</div>

    <nav>
      <ul>
        <li><a href="https://kristoffe99.github.io/home/">Home</a></li>
        <li><a href="https://kristoffe99.github.io/meet-the-team/">Meet the team</a></li>
        <li><a href="https://kristoffe99.github.io/profession/">Profession</a></li>
        <li><a href="https://kristoffe99.github.io/apply/">Apply</a></li>
        <li><a href="https://kristoffe99.github.io/courses/">Courses</a></li>
      </ul>
    </nav>

    <div class="search-bar">
      <input type="text" placeholder="Search">
      <button>Search</button>
    </div>
  </header>

  <main class="main-container">
    <div class="apply-box">
      <h2>Application Form</h2>
      <form>
        <div>
          <label for="full-name">Full Name</label>
          <input type="text" id="full-name" name="full-name" placeholder="John Doe" required>
        </div>

        <div>
          <label for="birth-date">Birth Date</label>
          <input type="date" id="birth-date" name="birth-date" required>
        </div>

        <div class="address-group">
          <div>
            <label for="street">Street</label>
            <input type="text" id="street" name="street" placeholder="123 Main St" required>
          </div>
          <div>
            <label for="town">Town</label>
            <input type="text" id="town" name="town" placeholder="Town Name" required>
          </div>
          <div>
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="City Name" required>
          </div>
        </div>

        <button type="submit" class="submit-btn">Submit Application</button>
      </form>
    </div>
  </main>

</body>
</html>
